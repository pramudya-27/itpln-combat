[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  TZ = "Asia/Jakarta"
  PUBLIC_CLOUDINARY_CLOUD_NAME = "dkrxyn8i5"
  SECRETS_SCAN_OMIT_KEYS = "TZ,NODE_VERSION,PUBLIC_CLOUDINARY_CLOUD_NAME,PUBLIC_CLOUDINARY_API_KEY"

[[redirects]]
  from = "/api/v1"
  to = "/.netlify/functions/decap-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/cms"
  to = "/cms/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
