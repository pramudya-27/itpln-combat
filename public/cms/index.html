<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decap CMS (GitHub Sync) – ITPLN COMBAT</title>
  <link rel="icon" type="image/webp" href="/logo.webp" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { margin: 0; padding-top: 48px; font-family: system-ui, sans-serif; }
    .cms-top-strip {
      position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 99999;
      background: #0a0a0c; border-bottom: 2px solid #e0161d; color: #fff;
      display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    }
    .cms-top-strip a {
      color: #fff; text-decoration: none; font-weight: 700; font-size: 13px;
      padding: 6px 12px; border-radius: 4px; border: 1px solid #333; background: #16161a;
    }
    .cms-top-strip a:hover { background: #e0161d; border-color: #e0161d; }
  </style>
</head>
<body>
  <div class="cms-top-strip">
    <strong style="letter-spacing: 0.05em;">ITPLN COMBAT • DECAP CMS (GIT SYNC)</strong>
    <div style="display:flex; gap:8px;">
      <a href="/admin">← Kembali ke Admin Dashboard</a>
      <a href="/">Lihat Website</a>
    </div>
  </div>
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () {
            document.location.href = '/cms/';
          });
        }
      });
    }
  </script>
</body>
</html>
